<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fc">
  <meta name="description" content="행운번호 서비스 제휴 및 광고 협업 문의 페이지입니다.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://leeshee228-blip.github.io/product-builder-lecture/partnership.html">

  <meta name="google-adsense-account" content="ca-pub-3066405936281794">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3066405936281794" crossorigin="anonymous"></script>

  <title>제휴 및 광고 문의 - 행운번호</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      color: #172033;
      background: #f7f8fc;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;

      --bg: #f7f8fc;
      --card-bg: rgba(255, 255, 255, .88);
      --card-border: rgba(230, 232, 242, .9);
      --text: #172033;
      --intro: #777f93;
      --hint: #9299aa;
      --placeholder-bg: #f6f7fb;
      --radial-gradient: radial-gradient(ellipse at 50% 0%, rgba(223, 232, 255, .72), transparent 42rem);
      --toggle-bg: #eef0f8;
      --toggle-hover: #e2e5f2;
      --toggle-text: #4a526d;
      --disclaimer: #a0a6b4;
    }

    :root.dark {
      color-scheme: dark;
      --bg: #0b0f19;
      --card-bg: rgba(17, 24, 39, .88);
      --card-border: rgba(31, 41, 55, .9);
      --text: #f3f4f6;
      --intro: #9ca3af;
      --hint: #9ca3af;
      --placeholder-bg: #1f2937;
      --radial-gradient: radial-gradient(ellipse at 50% 0%, rgba(30, 41, 59, .5), transparent 42rem);
      --toggle-bg: #1f2937;
      --toggle-hover: #374151;
      --toggle-text: #d1d5db;
      --disclaimer: #6b7280;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: var(--radial-gradient), var(--bg);
      color: var(--text);
      transition: background .3s ease, color .3s ease;
    }

    button { font: inherit; }

    .page {
      width: min(100% - 40px, 900px);
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: inherit;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.6px;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 11px;
      background: #6658e8;
      color: white;
      font-size: 19px;
      box-shadow: 0 5px 12px rgba(102, 88, 232, .24);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      padding: 0;
      border: 0;
      border-radius: 12px;
      background: var(--toggle-bg);
      color: var(--toggle-text);
      cursor: pointer;
      font-size: 17px;
      transition: background .18s ease, transform .18s ease;
    }

    .theme-toggle:hover {
      background: var(--toggle-hover);
      transform: scale(1.05);
    }

    .theme-toggle:focus-visible { outline: 2px solid #6658e8; outline-offset: 2px; }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 48px;
      padding: 10px 16px;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      background: var(--card-bg);
      backdrop-filter: blur(8px);
    }

    .nav-link {
      color: var(--intro);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 10px;
      transition: color .18s ease, background .18s ease;
    }

    .nav-link:hover, .nav-link.active {
      color: #6658e8;
      background: var(--toggle-bg);
    }

    .partnership-card {
      padding: 44px 40px;
      border: 1px solid var(--card-border);
      border-radius: 24px;
      background: var(--card-bg);
      box-shadow: 0 18px 55px rgba(47, 54, 90, .08);
      backdrop-filter: blur(8px);
      text-align: left;
    }

    .partnership-title {
      margin: 0 0 8px;
      font-size: clamp(26px, 5vw, 36px);
      font-weight: 850;
      letter-spacing: -1.2px;
    }

    .partnership-desc {
      margin: 0 0 32px;
      color: var(--intro);
      font-size: 15px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
    }

    .form-input, .form-textarea {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      background: var(--placeholder-bg);
      color: var(--text);
      font: inherit;
      font-size: 15px;
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    .form-input:focus, .form-textarea:focus {
      outline: none;
      border-color: #6658e8;
      box-shadow: 0 0 0 3px rgba(102, 88, 232, .18);
    }

    .form-textarea {
      resize: vertical;
      min-height: 140px;
    }

    .submit-button {
      display: inline-flex;
      width: 100%;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      background: #6658e8;
      color: white;
      cursor: pointer;
      font-size: 16px;
      font-weight: 750;
      box-shadow: 0 6px 16px rgba(102, 88, 232, .25);
      transition: transform .18s ease, background .18s ease;
    }

    .submit-button:hover {
      transform: translateY(-2px);
      background: #594bd9;
    }

    .disclaimer {
      margin: 48px 0 0;
      text-align: center;
      color: var(--disclaimer);
      font-size: 12px;
      line-height: 1.7;
    }

    @media (max-width: 560px) {
      .page { width: min(100% - 28px, 900px); padding-top: 22px; }
      .partnership-card { padding: 30px 20px; border-radius: 20px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="행운번호 홈">
        <span class="brand-mark" aria-hidden="true">7</span>
        <span>행운번호</span>
      </a>
      <div class="topbar-right">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="테마 전환">
          <span id="theme-icon" aria-hidden="true">🌙</span>
        </button>
      </div>
    </header>

    <nav class="nav-links" aria-label="메인 메뉴">
      <a href="index.html" class="nav-link">홈</a>
      <a href="guide.html" class="nav-link">가이드</a>
      <a href="faq.html" class="nav-link">FAQ</a>
      <a href="partnership.html" class="nav-link active">제휴문의</a>
      <a href="privacy.html" class="nav-link">개인정보처리방침</a>
    </nav>

    <main>
      <section class="partnership-card">
        <h1 class="partnership-title">🤝 제휴 및 광고 문의</h1>
        <p class="partnership-desc">서비스 제휴나 광고 협업 관련 궁금하신 점이나 제안을 남겨주시면 확인 후 신속하게 회신해 드리겠습니다.</p>
        <form action="https://formspree.io/f/xwllvvle" method="POST">
          <div class="form-group">
            <label for="name">성함 또는 회사명</label>
            <input class="form-input" id="name" name="name" type="text" required placeholder="홍길동 또는 (주)회사명">
          </div>
          <div class="form-group">
            <label for="email">이메일 주소</label>
            <input class="form-input" id="email" name="email" type="email" required placeholder="name@example.com">
          </div>
          <div class="form-group">
            <label for="message">문의 내용</label>
            <textarea class="form-textarea" id="message" name="message" required placeholder="제휴 내용이나 문의사항을 상세히 입력해 주세요."></textarea>
          </div>
          <button class="submit-button" type="submit">제휴 문의 보내기</button>
        </form>
      </section>
    </main>

    <footer class="disclaimer">
      <p>Copyright © 행운번호 All rights reserved.</p>
    </footer>
  </div>

  <script>
    const themeToggle = document.querySelector("#theme-toggle");
    const themeIcon = document.querySelector("#theme-icon");
    const rootElement = document.documentElement;

    const savedTheme = localStorage.getItem("theme");
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

    if (savedTheme === "dark" || (!savedTheme && prefersDark)) {
      rootElement.classList.add("dark");
      themeIcon.textContent = "☀️";
    }

    themeToggle.addEventListener("click", () => {
      const isDark = rootElement.classList.toggle("dark");
      themeIcon.textContent = isDark ? "☀️" : "🌙";
      localStorage.setItem("theme", isDark ? "dark" : "light");
    });
  </script>
</body>
</html>
